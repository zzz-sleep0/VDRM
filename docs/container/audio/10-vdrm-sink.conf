# VDRM：容器里的 /dev/snd 只 bind 了 vdrm 那张卡，没有 udev 冷插拔，
# WirePlumber 的 ALSA 监视器在这套环境里枚举不到任何设备（wpctl 里
# Devices/Sinks 全空）。这里按 PipeWire 的静态节点写法直接挂一个 adapter
# 到 vdrm 的 PCM 上，不依赖 udev 发现。
#
# 放到 /etc/pipewire/pipewire.conf.d/10-vdrm-sink.conf。
# 空闲时 PipeWire 会自己把 PCM 关掉，内核的 play_users 随之回到 0，
# App 的按需 AAudio 就跟着停 —— 这条链依赖的正是这个"会关"的行为。
context.objects = [
  { factory = adapter
    args = {
      factory.name         = api.alsa.pcm.sink
      node.name            = "vdrm-sink"
      node.description     = "VDRM virtual audio"
      media.class          = "Audio/Sink"
      api.alsa.path        = "hw:0,0"
      api.alsa.period-size = 1024
      api.alsa.headroom    = 0
      audio.channels       = 2
      audio.position       = [ FL FR ]
      audio.rate           = 48000
      node.driver          = true
      node.suspend-on-idle = false
    }
  }
]
