# VDRM：会话是 root 自动登录，而 Fedora 的 PipeWire 单元默认拒绝 root：
#
#   /usr/lib/systemd/user/pipewire.socket:3:  ConditionUser=!root
#   /usr/lib/systemd/user/pipewire.service:17: ConditionUser=!root
#
# 条件不满足时 systemd 直接 skip（不是失败），socket 不监听，pipewire、
# wireplumber、pipewire-pulse 全都起不来，KDE 里就是"没有声音设备"。
#
# 空赋值会把条件列表清掉。放到 /etc/systemd/user/<unit>.d/ 下即可，
# 四个单元各一份（pipewire.socket / pipewire.service /
# pipewire-pulse.socket / pipewire-pulse.service）。
[Unit]
ConditionUser=
