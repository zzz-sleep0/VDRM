name: Build vdrm.ko (DDK)

# 照抄 _patchHarmony 的 matrix 形状：一个 KMI 一份产物。
# 掐头去尾：不要最老的 5.10、也不要最新的 6.18，取中间六档。
# 只有 android14-6.1 是本机设备、能实测；其余五档以 CI 编过为准（给别人试）。
# GitHub 只读仓库根的 .github/workflows，所以 workflow 放这儿，
# 用 working-directory 指到 vdrm-ko-ddk/。

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1     # 本机设备，唯一能实测的一档
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}
      options: --privileged
    defaults:
      run:
        working-directory: vdrm-ko-ddk
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.kmi }}
        run: |
          make KDIR=/opt/ddk/kdir/${{ matrix.kmi }} 2>&1 | tee build.log
          test -f vdrm.ko
          # 【文件名就是 KMI】—— 模块里的 service.sh 按这个名字精确匹配，是契约，
          # 别改回 vdrm.ko，也别在别处再改名。
          mv vdrm.ko vdrm-${{ matrix.kmi }}.ko

      - name: Show vermagic
        run: |
          modinfo -F vermagic vdrm-${{ matrix.kmi }}.ko 2>/dev/null \
            || strings vdrm-${{ matrix.kmi }}.ko | grep '^vermagic='

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vdrm-${{ matrix.kmi }}
          # 只传 .ko —— 文件名就是 KMI，是跟 service.sh 的契约。
          # build.log 不传：六个都叫这个名字，合并下载时会互相盖；日志在 CI 的 run 里。
          path: vdrm-ko-ddk/vdrm-${{ matrix.kmi }}.ko
          if-no-files-found: warn

  # 六个 KMI 都编好之后，装配成"那个模块"——一个可直接安装的 zip。
  # 用的就是仓库根的 make-module.py，跟本地同一个动作。
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: vdrm-*
          merge-multiple: true
          path: vdrm-ko-ddk

      - name: 装配模块 zip
        run: |
          ls -l vdrm-ko-ddk/
          python3 make-module.py

      - uses: actions/upload-artifact@v4
        with:
          name: vdrm-lkm-module
          path: vdrm-lkm-*.zip
