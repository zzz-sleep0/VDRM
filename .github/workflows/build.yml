name: Build APK

on:
  push:
    branches: [ main ]
    paths:                      # 只有 app 相关变了才跑；推 vdrm-ko/ 不会触发
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:            # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'          # AGP 8.2 要求 Gradle >= 8.2

      # ubuntu-22.04 runner 自带 Android SDK（ANDROID_SDK_ROOT 已配好），
      # 所以不用 android-actions/setup-android —— 那一步正是上次失败的原因。
      # 注意 runner 上 cmdline-tools 的目录名不一定是 latest，动态找。
      - name: Install NDK + CMake
        run: |
          SDKM=$(command -v sdkmanager || ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager = $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vdrm-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
