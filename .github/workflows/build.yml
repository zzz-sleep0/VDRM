name: Build APK

on:
  workflow_call:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:            # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 debug 签名：AGP 首次会生成 ~/.android/debug.keystore；用 cache 把它
      # 跨 run 留住，周与周之间的 APK 才能互相覆盖安装（cache 被驱逐才会换 key）。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vdrm-debug-keystore-v1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'          # AGP 8.2 要求 Gradle >= 8.2

      # ubuntu-22.04 runner 自带 Android SDK（ANDROID_SDK_ROOT 已配好），
      # 所以不用 android-actions/setup-android —— 那一步正是上次失败的原因。
      # 注意 runner 上 cmdline-tools 的目录名不一定是 latest，动态找。
      - name: Install NDK + CMake
        run: |
          SDKM=$(command -v sdkmanager || ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager = $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vdrm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
