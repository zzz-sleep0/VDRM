name: Weekly release

# 每次 push 都跑（只改 README.md 的 push 跳过）；同一 ISO 周内所有 commit 覆盖
# 同一个 release，跨周自动新建。资产固定三个：模块 zip、vdrm_gbm.so、debug APK。

on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ko:
    uses: ./.github/workflows/build-vdrm-ko.yml

  apk:
    uses: ./.github/workflows/build.yml

  release:
    needs: [ko, apk]
    # 固定在 22.04：vdrm_gbm.so 在这里现编，跑在用户容器里。
    # 构建机的 glibc 就是产物的 glibc 下限 —— 用 ubuntu-latest（24.04）会让
    # 它要 GLIBC_2.38，Debian 12 / Ubuntu 22.04 直接加载失败。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download module zip
        uses: actions/download-artifact@v4
        with:
          name: vdrm-lkm-module
          path: assets

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: vdrm-apk
          path: assets

      # vdrm_gbm.so 是【构建产物】（.gitignore 里有 *.so），仓库里没有它。
      # 以前这里直接 cp，等于依赖"本地编好、恰好没被清掉"的文件 —— 干净
      # checkout 上这一步会 cp 失败。所以在装配前现编一次：
      # 只依赖 libc + 容器/构建机自带的 gbm.h，几十毫秒的事。
      - name: Build vdrm_gbm.so
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          make -C vdrm-gbm
          file vdrm-gbm/vdrm_gbm.so

      - name: Collect assets
        run: |
          cp vdrm-gbm/vdrm_gbm.so assets/
          cd assets
          # 资产名固定，周内覆盖、跨周也能直接对比
          mv app-debug.apk vdrm-debug.apk
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: Publish weekly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="weekly-$(date -u +%G-W%V)"
          TITLE="Weekly ${TAG#weekly-}"
          NOTES="Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Tested: android14-6.1 (OPlus), 120Hz virtual mode
          Assets: vdrm-lkm module zip, vdrm_gbm.so (aarch64 glibc), debug APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TITLE" --notes "$NOTES"
          fi

          # 模块包的文件名带版本号，所以 --clobber 只能覆盖同名的那一个；
          # 版本一升，旧 zip 就会留在 release 里（还会和 SHA256SUMS 对不上）。
          # 这里只保留这次构建出来的那个，其余 vdrm-lkm-*.zip 全部删掉。
          CUR=$(ls assets | sed -n 's/^\(vdrm-lkm-.*\.zip\)$/\1/p' | head -1)
          if [ -n "$CUR" ]; then
            gh release view "$TAG" --json assets -q '.assets[].name' |
            while read -r n; do
              case "$n" in
                vdrm-lkm-*.zip) [ "$n" = "$CUR" ] || gh release delete-asset "$TAG" "$n" -y ;;
              esac
            done
          fi
