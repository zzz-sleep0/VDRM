plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vdrm.consumer'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.vdrm.consumer'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '0.5.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        // Package the prebuilt library from src/main/jniLibs.
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // Native sources/CMakeLists.txt remain for manual native rebuilds.
}
