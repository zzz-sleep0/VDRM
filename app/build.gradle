plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vdrm.consumer'
    compileSdk 34
    ndkVersion '27.2.12479018'   // r27c：r25 的 surface_control.h 缺 __cplusplus 保护，C 编不过

    defaultConfig {
        applicationId 'com.vdrm.consumer'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '0.5.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // native 从源码编：jni/ 是唯一真源，CI 顺带充当“源码能不能编过”的守门人。
    // 产物直接打进 APK，不再需要预置 jniLibs/*.so。
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
