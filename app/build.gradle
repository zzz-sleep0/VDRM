plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vdrm.consumer'
    compileSdk 34
    ndkVersion '30.0.16248370'   // r30：r25~r27 的 surface_control.h 里 C++ 重载没加 __cplusplus 保护，C 编不过；r29 起才修

    defaultConfig {
        applicationId 'com.vdrm.consumer'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '0.5.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                /* AGP 默认拿 minSdk 当 NDK 的编译 API 级别。NDK 头里
                 * ASurfaceTransaction_setGeometry 的 C 版本被
                 * __ANDROID_API__ >= 34 挡着，级别不够就只剩一个
                 * const ARect& 的 C++ 重载 —— C 编不过（实测）。
                 * 这里把【编译】级别抬到 34，minSdk 不动。*/
                arguments '-DANDROID_PLATFORM=android-34'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // native 从源码编：jni/ 是唯一真源，CI 顺带充当“源码能不能编过”的守门人。
    // 产物直接打进 APK，不再需要预置 jniLibs/*.so。
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
