# VDRM 输出分辨率
#   1920x1080 = 兜底/留黑边（.ko 自带默认也是 1920x1080@120）
#   2376x1080 = Action 采到的真实分辨率，铺满（摄像头挖空会压在桌面上）
#   auto      = 开机时采当前逻辑分辨率（竖屏自动转横屏；建议用 Action 采）
mode=1920x1080

# UI 缩放：EDID 里报给合成器的 DPI（不给 = 用 .ko 默认，160x90mm ≈ 305dpi）
# niri 实测按 scale ≈ dpi/128（取到 0.25）算：
#   128 → 1.0（1920 宽 → 1920 逻辑宽）
#   192 → 1.5（→ 1280）
#   256 → 2.0（→ 960）
#   305 → 2.25（→ 853，默认）
#   384 → 3.0（→ 640）
# 数字越大，UI 越大、一屏装得下的东西越少。
#dpi=256

# 刷新率（Hz，24..240，不给 = 120）。虚拟输出没有真实扫描，这个值决定
# EDID 里报的 preferred 档，也决定 niri 默认出多少帧（120 档动画顺滑，60 档省电）。
# 合成器运行时自己也能在报出去的几档（refresh / 120 / 90 / 60）之间切。
#refresh=120
